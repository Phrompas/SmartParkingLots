version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark123
      POSTGRES_DB: smartparkinglot
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: smartparking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  postgres_data: